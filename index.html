<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>المصحف التفاعلي - بصوت العفاسي</title>
<style>
:root{
    --primary-color:#A57455;--hover-color:#8A5C41;--bg-color:#FDF6EE;
    --accent-green:#1C7A43;--accent-green-dark:#135A32;
    --green-light:#E7F0EA;
    --overlay-bg:#F6EFE0;--card-bg:#FFFDF8;
    --text-dark:#2E2A22;--text-muted:#A9906D;--badge-bg:#E9DEC6;
    --badge-text:#7C6640;--danger-text:#B23A3A;--danger-bg:#F7E0DE;
    --divider-color:#E5D9BF;--copper-dark:#7C6640;
    --icon-color:#8A5C41;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
    background:var(--bg-color);margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;
    font-family:Arial,sans-serif;
    -webkit-touch-callout:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
}

#svg-container{width:100vw;height:100vh;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;background:var(--bg-color);touch-action:pan-y;position:relative}
#svg-container>svg{width:100%;height:100%;max-width:100vw;max-height:100vh;object-fit:contain;display:block;position:relative;z-index:2}

#highlight-layer {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
}
.highlight-rect {
    position: absolute;
    border-radius: 6px;
    background: #EAD0B3;
    opacity: 0.9;
    will-change: transform, opacity;
    transition: all 0.2s ease-in-out;
}
body.dark-mode .highlight-rect {
    background: #4a3e2a;
}

#ayah-hit-layer {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
}
.ayah-hit-rect {
    position: absolute;
    background: transparent;
    pointer-events: auto;
}

#word-mode-layer{position:absolute;inset:0;z-index:4;pointer-events:none}
.word-hit-box{position:absolute;pointer-events:auto;cursor:pointer;border-radius:6px;background:rgba(28,122,67,.16);border:1.5px solid var(--accent-green);transition:background .15s}
.word-hit-box:active,.word-hit-box.playing{background:rgba(28,122,67,.35)}
body.dark-mode .word-hit-box{background:rgba(76,175,123,.2);border-color:#4CAF7B}
body.dark-mode .word-hit-box:active,body.dark-mode .word-hit-box.playing{background:rgba(76,175,123,.4)}

#word-mode-close{
    position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:1500;background:var(--primary-color);color:#fff;border:none;border-radius:20px;
    padding:9px 18px;font-size:13px;font-weight:bold;font-family:inherit;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.2);
    display:none;
}
#word-mode-close.visible{display:block}

#ayah-menu{
    position:fixed;left:0;right:0;bottom:0;z-index:2001;
    background:var(--overlay-bg);
    border-top-left-radius:18px;border-top-right-radius:18px;
    box-shadow:0 -8px 30px rgba(80,50,20,.18);
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    padding:8px 12px max(12px, env(safe-area-inset-bottom));
    max-height:38vh;overflow-y:auto;
}
#ayah-menu.open{transform:translateY(0)}
#ayah-menu-handle{width:40px;height:4px;background:var(--divider-color);border-radius:2px;margin:6px auto 8px}
#ayah-menu-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}
.ayah-menu-item{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:10px 6px;border:1px solid var(--divider-color);background:var(--card-bg);
    font-size:12.5px;font-weight:bold;color:var(--text-dark);
    text-align:center;font-family:inherit;cursor:pointer;
    border-radius:12px;
    border-top:3px solid var(--divider-color);
    box-shadow:0 1px 4px rgba(80,50,20,.06);
}
.ayah-menu-item .mi-icon{
    font-size:15px;width:30px;height:30px;line-height:30px;text-align:center;flex-shrink:0;
    background:var(--badge-bg);border-radius:50%;
}
#menu-copy{grid-column:1 / span 2}

/* ألوان مميزة هادئة لكل إجراء، من نفس هوية الموقع */
.mi-play{border-top-color:var(--accent-green)}
.mi-play .mi-icon{background:var(--green-light)}
.mi-tafsir{border-top-color:var(--primary-color)}
.mi-tafsir .mi-icon{background:var(--badge-bg)}
.mi-word{border-top-color:#8FA98C}
.mi-word .mi-icon{background:#E4ECE1}
.mi-bookmark{border-top-color:var(--copper-dark)}
.mi-bookmark .mi-icon{background:#EFE3CC}
.mi-copy{border-top-color:#B9A98C}
.mi-copy .mi-icon{background:#EFEAE0}

body.dark-mode #ayah-menu{background:#17130f}
body.dark-mode .ayah-menu-item{color:#EFE7D8;background:#241f18;border-color:#3a3226}
body.dark-mode .ayah-menu-item .mi-icon{background:#3a3226}
body.dark-mode .mi-play{border-top-color:#4CAF7B}
body.dark-mode .mi-tafsir{border-top-color:#C9B896}
body.dark-mode .mi-word{border-top-color:#7DA37A}
body.dark-mode .mi-bookmark{border-top-color:#C9B896}
body.dark-mode .mi-copy{border-top-color:#a99a7c}
body.dark-mode #ayah-menu-handle{background:#3a3226}

/* ===== قائمة صغيرة منبثقة فوق زر "علامة مرجعية" لاختيار نوعها ===== */
#bookmark-popup-backdrop{position:fixed;inset:0;z-index:2005;display:none}
#bookmark-popup-backdrop.open{display:block}
#bookmark-type-popup{
    position:fixed;z-index:2006;
    background:var(--card-bg);
    border-radius:14px;
    box-shadow:0 6px 24px rgba(80,50,20,.28);
    padding:6px;
    min-width:150px;
    display:none;
}
#bookmark-type-popup.open{display:block}
.bm-popup-item{
    display:flex;align-items:center;gap:10px;width:100%;
    padding:10px 12px;border:none;background:none;
    font-size:14px;font-weight:bold;color:var(--text-dark);
    text-align:right;font-family:inherit;cursor:pointer;
    border-radius:8px;
}
.bm-popup-item:active{background:var(--badge-bg)}
.bm-popup-item .mi-icon{
    font-size:14px;width:26px;height:26px;line-height:26px;text-align:center;flex-shrink:0;
    border-radius:50%;
}
.bm-choice-hifz .mi-icon{background:var(--green-light)}
.bm-choice-murajaah .mi-icon{background:#E9DEC6}
.bm-choice-tilawah .mi-icon{background:#F0E6D6}
.bm-choice-note .mi-icon{background:#E5DED3}
body.dark-mode #bookmark-type-popup{background:#241f18}
body.dark-mode .bm-popup-item{color:#EFE7D8}
body.dark-mode .bm-popup-item:active{background:#3a3226}

/* ===== شاشة إدخال الملاحظة (نفس أسلوب قائمة إجراءات الآية) ===== */
#note-input-sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:2002;
    background:var(--overlay-bg);
    border-top-left-radius:18px;border-top-right-radius:18px;
    box-shadow:0 -8px 30px rgba(80,50,20,.18);
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
    padding:10px 16px max(16px, env(safe-area-inset-bottom));
}
#note-input-sheet.open{transform:translateY(0)}
#note-input-handle{width:40px;height:4px;background:var(--divider-color);border-radius:2px;margin:6px auto 12px}
#note-input-title{font-size:15px;font-weight:bold;color:var(--primary-color);margin-bottom:10px;text-align:right}
#note-input-textarea{width:100%;border:1px solid #d1bdae;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;color:var(--text-dark);resize:vertical;text-align:right;direction:rtl;margin-bottom:12px}
#note-input-save-btn{width:100%;padding:11px;border:none;border-radius:8px;background:var(--accent-green);color:#fff;font-size:15px;font-weight:bold;font-family:inherit;cursor:pointer}
body.dark-mode #note-input-sheet{background:#17130f}
body.dark-mode #note-input-title{color:#C9B896}
body.dark-mode #note-input-textarea{background:#241f18;border-color:#3a3226;color:#EFE7D8}

#tafsir-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:2000;display:flex;flex-direction:column;transform:translateY(100%);opacity:0;transition:transform .3s ease,opacity .25s ease;pointer-events:none}
#tafsir-overlay.open{transform:translateY(0);opacity:1;pointer-events:auto}
.tafsir-header{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));flex-shrink:0;border-bottom:1px solid var(--divider-color)}
#tafsir-ayah-ref{flex:1;text-align:center;font-weight:bold;font-size:16px;color:var(--text-dark)}
#tafsir-tabs{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--divider-color);flex-shrink:0}
.tafsir-tab{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--primary-color);background:none;color:var(--primary-color);font-size:14px;font-weight:bold;font-family:inherit;cursor:pointer}
.tafsir-tab.active{background:var(--primary-color);color:#fff}
#tafsir-body{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch;font-size:19px;line-height:2.2;color:var(--text-dark);text-align:right}
body.dark-mode #tafsir-overlay{background:#17130f}
body.dark-mode .tafsir-header{border-color:#3a3226}
body.dark-mode #tafsir-ayah-ref{color:#EFE7D8}
body.dark-mode #tafsir-tabs{border-color:#3a3226}
body.dark-mode .tafsir-tab{border-color:#C9B896;color:#C9B896}
body.dark-mode .tafsir-tab.active{background:#4CAF7B;border-color:#4CAF7B;color:#0d1a12}
body.dark-mode #tafsir-body{color:#EFE7D8}

#ayah-toast{
    position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(20px);
    background:rgba(30,20,10,.9);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;
    z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
}
#ayah-toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

#top-bar, #bottom-bar {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(253,246,238,.97);
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
    border: 1px solid #EAD8C8;
    opacity: 0;
    pointer-events: none;
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    will-change: transform, opacity;
}

#top-bar {
    top: 0;
    transform: translateZ(0) translateY(-100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    padding-top: max(10px, env(safe-area-inset-top));
    border-top: none;
    border-left: none;
    border-right: none;
}

#bottom-bar {
    bottom: 0;
    transform: translateZ(0) translateY(100%);
    padding: 14px 16px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    border-bottom: none;
    border-left: none;
    border-right: none;
}

#top-bar.visible, #bottom-bar.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateZ(0) translateY(0);
}

.icon-btn{
    background:none;border:none;padding:8px;cursor:pointer;
    color:var(--icon-color);
    border-radius:10px;
    transition:background .2s,color .2s;
    display:flex;align-items:center;justify-content:center;
    width:40px;height:40px;
}
.icon-btn svg{width:22px;height:22px;display:block}
.icon-btn:hover,.icon-btn:active{background:rgba(165,116,85,.15)}
.top-bar-group{display:flex;align-items:center;gap:6px}

/* ===== تبويبات الشريط السفلي (التنقل / التلاوة المحدثة) ===== */
#bb-panel-range {
    display: flex;
    gap: 12px;
    width: 100%;
    flex-direction: row;
}
.bb-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
}
.range-chip {
    width: 100%;
    padding: 7px;
    border: 1px solid #d1bdae;
    border-radius: 8px;
    background: #fff;
    color: var(--primary-color);
    font-size: 13px;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.reciter-play-row {
    display: flex;
    gap: 6px;
    align-items: center;
    width: 100%;
}
.range-field-group {
    display: flex;
    gap: 6px;
    width: 100%;
}
.range-field {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 2px;
    border: 1px solid #d1bdae;
    border-radius: 8px;
    color: var(--primary-color);
    font-size: 11px;
    font-weight: bold;
    white-space: nowrap;
}
.range-field input {
    width: 90%;
    max-width: 60px;
    padding: 2px;
    border: 0;
    border-top: 1px solid #d1bdae;
    background: transparent;
    color: var(--primary-color);
    text-align: center;
    font-size: 14px;
    direction: ltr;
    outline: none;
    font-weight: bold;
}
.range-play-btn {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: var(--primary-color);
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: 0 2px 6px rgba(165,116,85,.35);
    transition: background 0.2s;
}
.range-play-btn.playing {
    background: var(--hover-color);
    box-shadow: 0 2px 6px rgba(138,92,65,.3);
}
.range-restart-btn {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--primary-color);
    background: none;
    color: var(--primary-color);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
}
body.dark-mode .range-restart-btn{border-color:#C9B896;color:#C9B896}

body.dark-mode .range-chip {background:#241f18;border-color:#3a3226;color:#C9B896}
body.dark-mode .range-field {border-color:#3a3226;color:#C9B896}
body.dark-mode .range-field input {color:#C9B896}

#range-overlay,#reciter-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:2000;display:flex;flex-direction:column;transform:translateY(100%);opacity:0;transition:transform .3s ease,opacity .25s ease;pointer-events:none}
#range-overlay.open,#reciter-overlay.open{transform:translateY(0);opacity:1;pointer-events:auto}
#range-overlay-title{flex:1;text-align:center;font-weight:bold;font-size:16px;color:var(--text-dark)}
.reciter-row{display:flex;align-items:center;gap:12px;padding:13px 20px;cursor:pointer;transition:background .15s;font-size:16px;color:var(--text-dark)}
.reciter-row:hover,.reciter-row.selected{background:#f5ece0}
body.dark-mode #range-overlay,body.dark-mode #reciter-overlay{background:#17130f}
body.dark-mode #range-overlay-title{color:#EFE7D8}
body.dark-mode .reciter-row{color:#EFE7D8}
body.dark-mode .reciter-row:hover,body.dark-mode .reciter-row.selected{background:#241f18}

[data-surah]{cursor:pointer}

.drawer-backdrop{position:fixed;inset:0;background:rgba(30,20,10,.4);z-index:2000;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{
    position:fixed;
    top:0;
    bottom:0;
    right:0;
    width:min(calc(94vw - 1.5cm), calc(460px - 1.5cm));
    background:var(--overlay-bg);
    z-index:2001;
    transform:translateX(105%);
    transition:transform .35s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
    box-shadow:-8px 0 30px rgba(80,50,20,.15);
}
.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--divider-color);background:var(--card-bg)}
.drawer-title{flex:1;font-size:16px;font-weight:bold;text-align:right;color:var(--text-dark)}
.drawer-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.juz-divider{padding:20px 22px 6px;font-size:15px;color:var(--copper-dark);font-weight:500}
.surah-row{display:flex;align-items:center;gap:14px;padding:12px 20px;cursor:pointer;transition:background .15s}
.surah-row:hover,.surah-row:active{background:#f5ece0}
.surah-row.current{background:#f5ece0}
.surah-num{width:42px;height:42px;border-radius:50%;background:var(--badge-bg);color:var(--copper-dark);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;flex-shrink:0}
.surah-row.current .surah-num{background:var(--accent-green);color:#fff}
.surah-info{flex:1;text-align:right}
.surah-name{font-size:20px;font-weight:bold;color:var(--text-dark);margin-bottom:3px}
.surah-meta{font-size:12px;color:var(--copper-dark)}

.bookmarks-list{padding:14px 16px}
#bookmark-tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
.bm-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--primary-color);background:none;color:var(--primary-color);font-size:12px;font-weight:bold;font-family:inherit;cursor:pointer}
.bm-tab.active{background:var(--primary-color);color:#fff}
.bookmark-note{margin-top:8px;padding:8px 10px;background:var(--badge-bg);border-radius:8px;font-size:13px;color:var(--badge-text);text-align:right}
.bookmark-empty{text-align:center;color:var(--text-muted);padding:60px 20px;font-size:15px;line-height:1.8}
.bookmark-empty small{font-size:12px;color:#b3a394}
.bookmark-card{background:var(--card-bg);border:1px solid var(--divider-color);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.bookmark-text{font-size:19px;line-height:2;text-align:right;color:var(--text-dark)}
.bookmark-text.text-reading{color:#9C6B3E}
.ayah-ref-badge{display:inline-block;background:var(--badge-bg);color:var(--badge-text);font-size:13px;font-weight:bold;padding:4px 10px;border-radius:8px;margin-inline-start:8px;vertical-align:middle}
.bookmark-meta{font-size:13px;margin-top:10px;font-weight:bold;color:var(--accent-green-dark)}
.remove-bookmark-btn{display:block;width:100%;margin-top:12px;padding:9px;border:none;border-radius:8px;background:var(--danger-bg);color:var(--danger-text);font-size:13px;font-weight:bold;cursor:pointer;font-family:inherit}

#search-overlay{position:fixed;inset:0;background:var(--overlay-bg);z-index:2000;display:flex;flex-direction:column;transform:translateY(100%);opacity:0;transition:transform .3s ease,opacity .25s ease;pointer-events:none}
#search-overlay.open{transform:translateY(0);opacity:1;pointer-events:auto}
.search-header{display:flex;align-items:center;gap:10px;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));flex-shrink:0;border-bottom:1px solid var(--divider-color)}
#search-input{flex:1;border:none;background:none;font-size:18px;color:var(--text-dark);outline:none;text-align:right;direction:rtl;font-family:inherit;-webkit-user-select:text;user-select:text}
#search-input::placeholder{color:var(--text-muted)}
.search-results-body{flex:1;overflow-y:auto;padding:0 18px 24px;-webkit-overflow-scrolling:touch}
.results-section-title{color:var(--text-muted);font-size:13px;padding:10px 4px;border-top:1px solid var(--divider-color);border-bottom:1px solid var(--divider-color);margin-top:6px}
.result-row{padding:14px 4px;border-bottom:1px solid var(--divider-color);cursor:pointer;display:flex;align-items:center;gap:10px}
.result-page-badge{flex-shrink:0;color:var(--text-muted);font-size:14px;min-width:26px;text-align:center}
.result-main{font-size:17px;font-weight:bold;color:var(--text-dark)}
.result-row--verse{flex-direction:column;align-items:stretch}
.result-verse-header{display:flex;align-items:center;justify-content:space-between}
.result-juz-badge{color:var(--text-muted);font-size:13px}
.result-ref{font-weight:bold;color:var(--text-dark);font-size:16px}
.result-verse-text{margin-top:8px;font-size:19px;line-height:2;color:var(--text-dark);text-align:right}
.result-verse-text .hl{color:#B0662E;font-weight:bold}
.search-empty,.search-loading{text-align:center;color:var(--text-muted);padding:50px 20px;font-size:15px}

.surah-header-bg{fill:#EADFD2;stroke:#A57455;stroke-width:1.5;}
.surah-header-ornament-path{fill:#FDF6EE;stroke:#A57455;stroke-width:1.5;}
.surah-name-path{fill:#000000;}

body.dark-mode{background-color:#000}
body.dark-mode #svg-container{background-color:#000}

const pressState={startX:0,startY:0,startTime:0,ayah:null,timer:null,longFired:false,moved:false};

document.addEventListener('pointerdown',e=>{
    if(e.target.closest('#top-bar,#bottom-bar,.drawer,.drawer-backdrop,#search-overlay,#ayah-menu,#tafsir-overlay,#range-overlay,#reciter-overlay,#note-input-sheet,#bookmark-type-popup,#bookmark-popup-backdrop,button,input,audio')) return;
    pressState.startX=e.clientX;pressState.startY=e.clientY;
    pressState.startTime=Date.now();
    pressState.longFired=false;pressState.moved=false;
    const ayah=e.target.closest('[data-surah][data-aya]');
    pressState.ayah=ayah;
    if(ayah){
        pressState.timer=setTimeout(()=>{
            pressState.longFired=true;pressState.timer=null;
            const s=ayah.getAttribute('data-surah'),a=ayah.getAttribute('data-aya');
            if(s&&a) openAyahMenu(s,a,ayah);
            if(navigator.vibrate) navigator.vibrate(30);
        },500);
    }
});

document.addEventListener('pointermove',e=>{
    if(!pressState.timer) return;
    const dx=Math.abs(e.clientX-pressState.startX),dy=Math.abs(e.clientY-pressState.startY);
    if(dx>20||dy>20){
        pressState.moved=true;
        if(pressState.timer){clearTimeout(pressState.timer);pressState.timer=null;}
    }
});

document.addEventListener('pointerup',e=>{
    if(pressState.timer){clearTimeout(pressState.timer);pressState.timer=null;}
    const dx=e.clientX-pressState.startX,dy=e.clientY-pressState.startY;
    const dt=Date.now()-pressState.startTime;

    if(pressState.longFired){pressState.longFired=false;pressState.ayah=null;return;}
    if(e.target.closest('#top-bar,#bottom-bar,.drawer,.drawer-backdrop,#search-overlay,#ayah-menu,#tafsir-overlay,#range-overlay,#reciter-overlay,#note-input-sheet,#bookmark-type-popup,#bookmark-popup-backdrop,button,input,audio')){pressState.ayah=null;return;}

    if(!pressState.moved&&dt<350){
        topBar.classList.toggle('visible');
        bottomBar.classList.toggle('visible');
    } else if(dt<1000&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
        if(dx>0) changePage(1); else changePage(-1);
    }
    pressState.ayah=null;
});

document.addEventListener('pointercancel',()=>{
    if(pressState.timer) clearTimeout(pressState.timer);
    pressState.timer=null;pressState.ayah=null;pressState.longFired=false;pressState.moved=true;
});

function getSvgUrl(pageNum){const p=String(pageNum).padStart(3,'0');return `https://raw.githubusercontent.com/mushafdatabase/MushafDatabase-Ligature-Based-SVG/main/SVG%20V1.01/${p}.svg`;}

function loadPage(pageNum){
    removeAyahHighlight();
    hitLayer.innerHTML='';
    exitWordMode();
    closeAyahMenu(false);
    closeTafsirOverlay();

    const oldSvg = svgContainer.querySelector('svg');
    if(oldSvg) oldSvg.remove();

    let loadingText = document.getElementById('loading-text');
    if(!loadingText){
        loadingText = document.createElement('p');
        loadingText.id = 'loading-text';
        svgContainer.appendChild(loadingText);
    }
    loadingText.style.cssText = 'text-align:center;color:#A57455;width:100%;margin-top:20px;position:absolute;z-index:4;';
    loadingText.innerText = 'جاري التحميل...';

    const svgUrl=getSvgUrl(pageNum);

    return fetch(svgUrl).then(r=>{if(!r.ok)throw new Error('تعذر جلب الصفحة.');return r.text();}).then(svgContent=>{
        let fixedSvg=svgContent.replace(/url\((['"]?)([^'")]+\.(?:ttf|woff2?|eot))\1\)/gi,(full,quote,relPath)=>{
            try{
                const abs=new URL(relPath,svgUrl).href;
                return `url('${abs.replace('https://raw.githubusercontent.com/mushafdatabase/MushafDatabase-Ligature-Based-SVG/main/','https://cdn.jsdelivr.net/gh/mushafdatabase/MushafDatabase-Ligature-Based-SVG@main/')}')`;
            }catch(e){return full;}
        });

        const styleRegex=/<style[^>]*>([\s\S]*?)<\/style>/gi;
        let allStyles='',m;
        while((m=styleRegex.exec(fixedSvg))!==null) allStyles+=m[1]+'\n';

        const extraStyles=`
            [data-surah][data-aya] path,[data-surah][data-aya] text{fill:#000 !important}
            g[data-type="end-aya"] path,g[data-type="end-aya"] circle,
            g[data-type="aya-number"] path,g[data-type="aya-number"] text,
            .aya-marker path{fill:#A57455 !important;stroke:none !important}
        `;
        let cs=document.getElementById('quran-fonts-style');
        if(!cs){cs=document.createElement('style');cs.id='quran-fonts-style';document.head.appendChild(cs);}
        cs.innerHTML=allStyles+extraStyles;

        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = fixedSvg;
        const newSvg = tempDiv.querySelector('svg');
        if(!newSvg) throw new Error('لم يتم العثور على SVG.');

        const lText = document.getElementById('loading-text');
        if(lText) lText.remove();

        svgContainer.appendChild(newSvg);
        newSvg.style.opacity='0';
        requestAnimationFrame(()=>{
            newSvg.style.transition='opacity .18s ease';
            newSvg.style.opacity='1';
        });

        buildAyahIndex(newSvg);
        addSurahHeader(newSvg);
        adjustHeaderFooterSafely(newSvg,pageNum);
        optimizeViewBox(newSvg,pageNum);
        requestAnimationFrame(()=>{
            lowerEntirePageOneMillimeter(newSvg);
            buildAyahHitAreas(newSvg);
        });
        applyThemeToSvg();

        pageIndicator.innerText=`صفحة: ${pageNum}`;
        pageInput.value=pageNum;
        prevBtn.disabled=pageNum===1;
        nextBtn.disabled=pageNum===totalPages;

        const first=newSvg.querySelector('[data-surah][data-aya]');
        if(first){
            currentSurahNumber=Number(first.getAttribute('data-surah'));
        }
        if(document.getElementById('index-drawer').classList.contains('open')) renderIndexList();
    }).catch(err=>{
        let lText = document.getElementById('loading-text');
        if(!lText){
            lText = document.createElement('p');
            lText.id = 'loading-text';
            svgContainer.appendChild(lText);
        }
        lText.style.cssText = 'text-align:center;color:red;width:100%;margin-top:20px;position:absolute;z-index:4;';
        lText.innerText = `خطأ: ${err.message}`;
    });
}

function applyThemeToSvg(){
    const svg=svgContainer.querySelector('svg');
    if(!svg) return;
    const isDark=document.body.classList.contains('dark-mode');
    const wordFill=isDark?'#FFFFFF':'#000000';
    const ayaFill=isDark?'#D9B98A':'#A57455';

    svg.querySelectorAll('[data-surah][data-aya] path, [data-surah][data-aya] text').forEach(el=>{
        el.setAttribute('fill',wordFill);
        el.style.setProperty('fill',wordFill,'important');
    });
    svg.querySelectorAll('g[data-type="end-aya"] path, g[data-type="end-aya"] circle, g[data-type="aya-number"] path, g[data-type="aya-number"] text, .aya-marker path').forEach(el=>{
        el.setAttribute('fill',ayaFill);
        el.style.setProperty('fill',ayaFill,'important');
        el.style.setProperty('stroke','none','important');
    });
}

function addSurahHeader(svg){
    const names=svg.querySelectorAll('g[data-type="surah-name"]');
    names.forEach((g,index)=>{
        if(!g.parentNode) return;
        const box=g.getBBox();
        if(!box.width||!box.height) return;
        const hp=Math.max(7,box.height*.9),vp=Math.max(3,box.height*.18);
        const hw=box.width+hp*2,hh=box.height+vp*2,hx=box.x-hp,hy=box.y-vp;
        const pi=svg.querySelector('#md-page-inner');
        const pr=pi?.getAttribute('data-rect')?.split(',').map(Number);
        const hg=document.createElementNS('http://www.w3.org/2000/svg','g');
        hg.id=`surah-header-decoration-${index}`;
        hg.setAttribute('pointer-events','none');
        if(pr?.length===4){
            const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
            r.setAttribute('class','surah-header-bg');
            r.setAttribute('x',pr[0]);r.setAttribute('y',hy);
            r.setAttribute('width',pr[2]-pr[0]);r.setAttribute('height',hh);
            hg.appendChild(r);
        }
        const orn=document.createElementNS('http://www.w3.org/2000/svg','svg');
        orn.setAttribute('x',hx);orn.setAttribute('y',hy);orn.setAttribute('width',hw);orn.setAttribute('height',hh);
        orn.setAttribute('viewBox','0 12 600 76');orn.setAttribute('preserveAspectRatio','none');
        orn.setAttribute('class','surah-header-ornament');
        orn.innerHTML=`<path class="surah-header-ornament-path" d="M 120,15 H 480 C 495,15 510,15 520,35 C 525,45 535,50 550,50 C 535,50 525,55 520,65 C 510,85 495,85 480,85 H 120 C 105,85 90,85 80,65 C 75,55 65,50 50,50 C 65,50 75,45 80,35 C 90,15 105,15 120,15 Z"/>`;
        g.querySelectorAll('path').forEach(p=>p.classList.add('surah-name-path'));
        hg.appendChild(orn);
        g.parentNode.insertBefore(hg,g);
    });
}

function lowerEntirePageOneMillimeter(svg){
    const pc=svg.querySelector('#md-page')||svg.querySelector('#md-page-outer');
    if(!pc) return;
    pc.style.transformBox='fill-box';
    pc.style.transform=`${pc.style.transform||''} translateY(1mm)`.trim();
}

function optimizeViewBox(svg,pageNum){
    const pi=svg.querySelector('#md-page-inner');if(!pi) return;
    const rd=pi.getAttribute('data-rect');if(!rd) return;
    const v=rd.split(',').map(Number);if(v.length!==4) return;
    const [x1,y1,x2,y2]=v;const ph=y2-y1,lh=ph/15;
    if(svg.getAttribute('viewBox')){
        const hp=6,nx=x1-hp,nw=(x2-x1)+hp*2;
        if(pageNum===1||pageNum===2){
            const ct=lh*1.2,cb=lh*2.2;
            svg.setAttribute('viewBox',`${nx} ${y1+ct} ${nw} ${ph-ct-cb}`);
        }else{
            const ct=35,bp=35;
            svg.setAttribute('viewBox',`${nx} ${y1+ct} ${nw} ${ph-ct+bp}`);
        }
    }
}

function adjustHeaderFooterSafely(svg,pageNum){
    const pi=svg.querySelector('#md-page-inner');if(!pi) return;
    const rd=pi.getAttribute('data-rect');if(!rd) return;
    const v=rd.split(',').map(Number);if(v.length!==4) return;
    const [x1,y1,x2,y2]=v;const midX=x1+(x2-x1)/2,ph=y2-y1,lh=ph/15;

    if(pageNum===1||pageNum===2){
        const ays=Array.from(svg.querySelectorAll('[data-surah][data-aya]'));
        if(pageNum===2){
            const bs=svg.querySelector('#md-line-07[data-type="bismillah"]');
            if(bs){bs.style.transformBox='fill-box';bs.style.transformOrigin='center';bs.style.transform='translate(4.3px, calc(-2cm + 0.6px))';}
        }
        ays.forEach(a=>{a.style.transformBox='fill-box';a.style.transformOrigin='center';a.style.transform='translateY(-2cm)';});
        return;
    }
    requestAnimationFrame(()=>{
        function pn(node){
            if(!node.getBBox) return;
            const tn=node.tagName.toLowerCase();
            if(['defs','style','title','desc'].includes(tn)) return;
            if(node.id&&node.id.startsWith('surah-header-decoration')) return;
            if(node.id==='md-page-inner') return;
            try{
                const b=node.getBBox();
                if(b.width===0||b.height===0) return;
                if(b.y+b.height<=y1+10){
                    node.style.transformBox='fill-box';node.style.transformOrigin='center';
                    node.setAttribute('fill','#A57455');
                    Array.from(node.querySelectorAll('path,text')).forEach(c=>c.setAttribute('fill','#A57455'));
                    const mx=(b.x+b.width/2<midX)?12:-12;
                    node.style.transform=`translate(${mx}px, 40px) scale(0.9)`;
                    return;
                }else if(b.y>=y2-10){
                    node.style.transformBox='fill-box';node.style.transformOrigin='center';
                    node.setAttribute('fill','#A57455');
                    Array.from(node.querySelectorAll('path,text')).forEach(c=>c.setAttribute('fill','#A57455'));
                    node.style.transform='translate(0px, -32px) scale(0.9)';
                    return;
                }else if(tn==='g'||tn==='svg'){
                    Array.from(node.children).forEach(pn);
                }
            }catch(e){}
        }
        Array.from(svg.children).forEach(pn);
    });
}

function buildAyahIndex(svg){
    ayahIndex=new Map();
    const all=svg.querySelectorAll('[data-surah][data-aya]');
    all.forEach(el=>{
        const key=Number(el.getAttribute('data-surah'))+'-'+Number(el.getAttribute('data-aya'));
        let arr=ayahIndex.get(key);
        if(!arr){arr=[];ayahIndex.set(key,arr);}
        arr.push(el);
    });
}

function computeAyahLines(parts){
    const rects = parts.map(p => p.getBoundingClientRect()).filter(r => r.width > 0 && r.height > 0);
    if(!rects.length) return [];
    const lines = [];
    const lineThreshold = 15;
    rects.forEach(rect => {
        let added = false;
        for (let i = 0; i < lines.length; i++) {
            if (Math.abs(lines[i].y - rect.y) < lineThreshold) {
                lines[i].left = Math.min(lines[i].left, rect.left);
                lines[i].right = Math.max(lines[i].right, rect.right);
                lines[i].top = Math.min(lines[i].top, rect.top);
                lines[i].bottom = Math.max(lines[i].bottom, rect.bottom);
                added = true;
                break;
            }
        }
        if (!added) {
            lines.push({y: rect.y, left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom});
        }
    });
    return lines;
}

function removeAyahHighlight(){
    highlightLayer.innerHTML = '';
}

function addAyahHighlight(ayahEl){
    requestAnimationFrame(() => {
        try {
            const surah=ayahEl.getAttribute('data-surah');
            const ayah=ayahEl.getAttribute('data-aya');
            const svg=svgContainer.querySelector('svg');
            if(!surah||!ayah||!svg) return;

            const parts=ayahIndex.get(Number(surah)+'-'+Number(ayah))||[];
            if(!parts.length) return;

            const containerRect = highlightLayer.getBoundingClientRect();
            const lines = computeAyahLines(parts);
            if(!lines.length) return;

            highlightLayer.innerHTML = '';
            const fragment = document.createDocumentFragment();
            lines.forEach(line => {
                const div = document.createElement('div');
                div.className = 'highlight-rect';
                const padX = 6, padY = 4;
                div.style.left = (line.left - containerRect.left - padX) + 'px';
                div.style.top = (line.top - containerRect.top - padY) + 'px';
                div.style.width = (line.right - line.left + padX * 2) + 'px';
                div.style.height = (line.bottom - line.top + padY * 2) + 'px';
                fragment.appendChild(div);
            });
            highlightLayer.appendChild(fragment);
        } catch(e) {}
    });
}

function buildAyahHitAreas(svg){
    try{
        hitLayer.innerHTML='';
        if(!ayahIndex.size) return;
        const containerRect = hitLayer.getBoundingClientRect();
        const fragment = document.createDocumentFragment();
        ayahIndex.forEach((parts,key)=>{
            const lines = computeAyahLines(parts);
            if(!lines.length) return;
            const sep=key.indexOf('-');
            const s=key.slice(0,sep), a=key.slice(sep+1);
            lines.forEach(line=>{
                const div=document.createElement('div');
                div.className='ayah-hit-rect';
                div.setAttribute('data-surah',s);
                div.setAttribute('data-aya',a);
                const padX=6,padY=6;
                div.style.left=(line.left-containerRect.left-padX)+'px';
                div.style.top=(line.top-containerRect.top-padY)+'px';
                div.style.width=(line.right-line.left+padX*2)+'px';
                div.style.height=(line.bottom-line.top+padY*2)+'px';
                fragment.appendChild(div);
            });
        });
        hitLayer.appendChild(fragment);
    }catch(e){}
}

function playAyah(surah,ayahNum,element){
    // منع تداخل الأصوات: لو كانت تلاوة النطاق شغالة، أوقفها أولًا (ستُستأنف من رأس نفس الآية لاحقًا)
    if(playbackState.active){
        playbackState.interruptedByOtherAudio=true;
        stopRecitation();
    }
    removeAyahHighlight();
    addAyahHighlight(element);
    const fs=String(surah).padStart(3,'0'),fa=String(ayahNum).padStart(3,'0');
    audioPlayer.src=`https://everyayah.com/data/${selectedReciter.folder}/${fs}${fa}.mp3`;
    audioPlayer.play().catch(()=>{});
}

function openBookmarkPopup(anchorEl){
    const popup=document.getElementById('bookmark-type-popup');
    const backdrop=document.getElementById('bookmark-popup-backdrop');
    const rect=anchorEl.getBoundingClientRect();
    popup.classList.add('open');
    backdrop.classList.add('open');
    requestAnimationFrame(()=>{
        const pRect=popup.getBoundingClientRect();
        let left=rect.left+rect.width/2-pRect.width/2;
        left=Math.max(8,Math.min(left,window.innerWidth-pRect.width-8));
        let top=rect.top-pRect.height-10;
        if(top<8) top=rect.bottom+10;
        popup.style.left=left+'px';
        popup.style.top=top+'px';
    });
}

function getAyahWordGroups(surah,ayah){
    const svg=svgContainer.querySelector('svg');
    if(!svg) return [];

    let all=[];
    try{
        all=Array.from(svg.querySelectorAll(`[data-surah="${surah}"][data-aya="${ayah}"]`));
    }catch(e){all=[];}

    // احتياط مهم: منطقة اللمس الموسّعة للآية (لتسهيل إصابتها) عناصر مُصطنعة تحمل رقم السورة/الآية
    // بصيغة عادية (بدون أصفار بادئة)، بينما عناصر SVG الحقيقية قد تحمل صيغة مختلفة (كأصفار بادئة)،
    // فقد لا يجد الاستعلام أعلاه أي تطابق إن جاء الاستدعاء من عنصر لمس مُصطنع. في هذه الحالة
    // نعتمد على فهرس الآيات (ayahIndex) المبني أصلًا من نفس عناصر SVG الحقيقية بمفاتيح موحّدة أرقامًا،
    // وهو نفس الفهرس المستخدم بنجاح للتظليل العادي.
    if(!all.length){
        const fallback=ayahIndex.get(Number(surah)+'-'+Number(ayah));
        if(fallback&&fallback.length) all=fallback.slice();
    }
    if(!all.length) return [];

    let candidates=all.filter(el=>el.id&&el.id.indexOf('md-word-')===0);
    if(!candidates.length) candidates=all.filter(el=>el.getAttribute('data-type')!=='aya-mark');
    if(!candidates.length) candidates=all;

    const realWords=candidates.filter(el=>{
        const textPaths=Array.from(el.querySelectorAll('[data-text]'));
        if(!textPaths.length) return false;
        return textPaths.some(p=>!p.hasAttribute('data-waqf'));
    });
    return realWords.length?realWords:candidates;
}

function wordElementLetters(el){
    return Array.from(el.querySelectorAll('[data-text]'))
        .filter(p=>!p.hasAttribute('data-waqf'))
        .map(p=>p.getAttribute('data-text')||'')
        .join('').replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,''); 
}

function mergeStandaloneWaw(words){
    const groups=[];
    for(let i=0;i<words.length;i++){
        const el=words[i];
        const letters=wordElementLetters(el);
        if(letters==='\u0648'&&i+1<words.length){
            groups.push([el,words[i+1]]);
            i++;
        }else{
            groups.push([el]);
        }
    }
    return groups;
}

function unionRect(elements){
    let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
    elements.forEach(el=>{
        const r=el.getBoundingClientRect();
        if(r.width===0&&r.height===0) return;
        left=Math.min(left,r.left);
        top=Math.min(top,r.top);
        right=Math.max(right,r.right);
        bottom=Math.max(bottom,r.bottom);
    });
    if(left===Infinity) return null;
    return {left,top,right,bottom,width:right-left,height:bottom-top};
}

function enterWordMode(surah,ayah){
    exitWordMode();
    removeAyahHighlight();
    const rawWords=getAyahWordGroups(surah,ayah);
    if(!rawWords.length) return;
    const groups=mergeStandaloneWaw(rawWords);
    const containerRect=wordModeLayer.getBoundingClientRect();
    const fragment=document.createDocumentFragment();
    groups.forEach((elements,idx)=>{
        const r=unionRect(elements);
        if(!r) return;
        const div=document.createElement('div');
        div.className='word-hit-box';
        const padX=3,padY=3;
        div.style.left=(r.left-containerRect.left-padX)+'px';
        div.style.top=(r.top-containerRect.top-padY)+'px';
        div.style.width=(r.width+padX*2)+'px';
        div.style.height=(r.height+padY*2)+'px';
        div.addEventListener('click',(e)=>{
            e.stopPropagation();
            playWordAudio(surah,ayah,idx+1);
            wordModeLayer.querySelectorAll('.word-hit-box').forEach(b=>b.classList.remove('playing'));
            div.classList.add('playing');
        });
        fragment.appendChild(div);
    });
    wordModeLayer.appendChild(fragment);
    wordModeActive=true;
    wordModeCloseBtn.classList.add('visible');
}

function exitWordMode(){
    wordModeLayer.innerHTML='';
    wordModeActive=false;
    wordModeCloseBtn.classList.remove('visible');
}
wordModeCloseBtn.addEventListener('click',exitWordMode);

function playWordAudio(surah,ayah,wordPos){
    // منع تداخل الأصوات: لو كانت تلاوة النطاق شغالة، أوقفها أولًا (ستُستأنف من رأس نفس الآية لاحقًا)
    if(playbackState.active){
        playbackState.interruptedByOtherAudio=true;
        stopRecitation();
    }
    const fs=String(surah).padStart(3,'0'),fa=String(ayah).padStart(3,'0'),fw=String(wordPos).padStart(3,'0');
    audioPlayer.src=`https://audio.qurancdn.com/wbw/${fs}_${fa}_${fw}.mp3`;
    audioPlayer.play().catch(()=>{});
}

const BISMILLAH_TEXT='بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';

// نبني نص الآية من عناصر المصحف (SVG) المعروضة فعليًا على الشاشة، بدل الاعتماد فقط على خدمة خارجية،
// لضمان تطابق النص المنسوخ تمامًا مع ما يراه المستخدم ويُظلَّل أمامه (ويعمل أيضًا بلا اتصال بالإنترنت).
function buildAyahTextFromPage(surah,ayah){
    const words=getAyahWordGroups(surah,ayah);
    if(!words.length) return '';
    const wordTexts=words.map(el=>
        Array.from(el.querySelectorAll('[data-text]')).map(p=>p.getAttribute('data-text')||'').join('')
    ).filter(t=>t.trim().length);
    return wordTexts.join(' ').replace(/\s+/g,' ').trim();
}

async function copyAyahText(surah,ayah){
    let text=buildAyahTextFromPage(surah,ayah);
    if(!text){
        // احتياط: إن تعذر استخراج النص من الصفحة الحالية (مثلًا الآية غير معروضة)، نلجأ للخدمة الخارجية
        const info=await fetchAyahInfo(surah,ayah);
        text=(info.text||'').trim();
    }
    if(!text){
        showToast('تعذر نسخ الآية');
        return;
    }
    // نُضيف البسملة قبل أول آية في أي سورة عدا الفاتحة (آيتها الأولى هي البسملة نفسها) والتوبة (لا بسملة لها)
    if(surahNeedsBismillah(surah,ayah)){
        text=BISMILLAH_TEXT+' '+text;
    }
    try{
        await navigator.clipboard.writeText(text);
        showToast('تم نسخ الآية');
    }catch(e){
        showToast('تعذر نسخ الآية');
    }
}

async function loadChapters(){
    try{
        const res=await fetch('https://api.quran.com/api/v4/chapters?language=ar');
        const json=await res.json();
        chaptersData=(json.chapters||[]).map(c=>({
            number:c.id,nameAr:c.name_arabic,versesCount:c.verses_count,
            startPage:c.pages[0],endPage:c.pages[1],
            revelationType:c.revelation_place==='makkah'?'مكية':'مدنية'
        }));
    }catch(e){chaptersData=[];}
    if(document.getElementById('index-drawer').classList.contains('open')) renderIndexList();
}

function surahForPage(p){let f=null;for(const c of chaptersData){if(c.startPage<=p) f=c;else break;}return f;}

function renderIndexList(){
    const el=document.getElementById('index-content');
    if(!chaptersData.length){el.innerHTML='<div class="juz-divider">جارِ تحميل الفهرس...</div>';return;}
    let html='';let juz=1;
    html+=`<div class="juz-divider">الجزء ${JUZ_ORDINALS_AR[0]}</div>`;
    for(let i=0;i<chaptersData.length;i++){
        const c=chaptersData[i];
        while(juz<30&&JUZ_START_PAGES[juz]<=c.startPage){
            juz++;
            html+=`<div class="juz-divider">الجزء ${JUZ_ORDINALS_AR[juz-1]}</div>`;
        }
        const isCur=c.number===currentSurahNumber;
        html+=`<div class="surah-row${isCur?' current':''}" data-page="${c.startPage}">
            <div class="surah-num">${toArabicDigits(c.number)}</div>
            <div class="surah-info">
                <div class="surah-name">${c.nameAr}</div>
                <div class="surah-meta">الصفحة ${toArabicDigits(c.startPage)} - آياتها ${toArabicDigits(c.versesCount)} - ${c.revelationType}</div>
            </div>
        </div>`;
    }
    el.innerHTML=html;
    el.querySelectorAll('.surah-row').forEach(row=>{
        row.addEventListener('click',()=>{
            if(playbackState.active) stopRecitation();
            const page=Number(row.getAttribute('data-page'));
            currentPage=page;loadPage(currentPage);
            audioPlayer.pause();audioPlayer.currentTime=0;
            closeDrawer('index-drawer','index-backdrop');

function surahForPageStart(n){const c=chaptersData.find(c=>c.number===n);return c?c.startPage:1;}

async function fetchAyahInfo(sn,an){
    try{
        const res=await fetch(`https://api.alquran.cloud/v1/ayah/${sn}:${an}/quran-uthmani`);
        const j=await res.json();
        return {text:(j&&j.data&&j.data.text)||'',page:(j&&j.data&&j.data.page)||surahForPageStart(sn)};
    }catch(e){return {text:'',page:surahForPageStart(sn)};}
}

function highlightMatch(text,query){
    const diacritics='[\\u0610-\\u061A\\u064B-\\u065F\\u06D6-\\u06DC\\u06DF-\\u06E8\\u06EA-\\u06ED\\u0670]*';
    const esc=query.split('').map(ch=>ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join(diacritics);
    try{return text.replace(new RegExp(esc,'g'),m=>`<span class="hl">${m}</span>`);}catch(e){return text;}
}

        });

}

async function performSearch(query){
    const el=document.getElementById('search-results');
    query=(query||'').trim();
    if(!query){el.innerHTML='';return;}

    const isNum=/^[0-9\u0660-\u0669]+$/.test(query);
    if(isNum){
        const n=parseInt(query.replace(/[\u0660-\u0669]/g,d=>String(d.charCodeAt(0)-0x0660)),10);
        let html='';
        if(n>=1&&n<=604){
            const s=surahForPage(n);
            html+=`<div class="results-section-title">الصفحات (١)</div>
                <div class="result-row" data-page="${n}">
                    <span class="result-page-badge">${toArabicDigits(n)}</span>
                    <span class="result-main">الصفحة ${toArabicDigits(n)}${s?' - '+s.nameAr:''}</span>
                </div>`;
        }
        if(n>=1&&n<=114){
            const c=chaptersData.find(c=>c.number===n);
            if(c){
                html+=`<div class="results-section-title">السور (١)</div>
                    <div class="result-row" data-page="${c.startPage}">
                        <span class="result-page-badge">${toArabicDigits(c.startPage)}</span>
                        <span class="result-main">${c.nameAr}: ١</span>
                    </div>`;
            }
        }
        el.innerHTML=html||'<div class="search-empty">لا توجد نتائج</div>';
        attachSearchHandlers();
        return;
    }

    el.innerHTML='<div class="search-loading">جارِ البحث...</div>';
    try{
        // نزيل التشكيل والتطويل من نص البحث لأن أغلب المستخدمين يكتبون بلا تشكيل،
        // وأي تشكيل عالق في النص المكتوب (كنسخ ولصق آية) يمنع المطابقة تمامًا
        const cleanedQuery=query.replace(/[\u0610-\u061A\u064B-\u065F\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED\u0670\u0640]/g,'').trim()||query;

        // نبحث أولًا في نسخة النص المجرّد من التشكيل (quran-simple-clean)، فهي الأقرب لطريقة كتابة
        // المستخدم العادية، وتُعطي نتائج أدق وأشمل من البحث في النص العثماني المُشكَّل بالكامل
        async function runSearch(q,edition){
            const res=await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent(q)}/all/${edition}`);
            const j=await res.json();
            return (j&&j.data&&j.data.matches)||[];
        }

        let matches=await runSearch(cleanedQuery,'quran-simple-clean');
        // احتياط: إذا لم نجد نتائج (مثلًا المستخدم لصق آية بتشكيلها الكامل ونريد مطابقة حرفية دقيقة)
        // نجرّب البحث في النص العثماني كما هو مكتوب
        if(!matches.length && cleanedQuery!==query){
            matches=await runSearch(query,'quran-uthmani');
        }
        if(!matches.length){
            matches=await runSearch(cleanedQuery,'quran-uthmani');
        }
        const count=matches.length;
        if(!matches.length){el.innerHTML='<div class="search-empty">لا توجد نتائج</div>';return;}
        let html=`<div class="results-section-title">الآيات (${toArabicDigits(count)})</div>`;
        matches.forEach(m=>{
            const page=m.page||(m.surah?surahForPageStart(m.surah.number):'');
            const juz=m.juz||'';
            const sLabel=m.surah?m.surah.name.replace('سورة ','').replace('سُورَةُ ','').replace('سُورَة ','').trim():'';
            html+=`<div class="result-row result-row--verse" data-page="${page}">
                <div class="result-verse-header">
                    <span class="result-juz-badge">${juz?toArabicDigits(juz):''}</span>
                    <span class="result-ref">${sLabel}: ${toArabicDigits(m.numberInSurah)}</span>
                </div>
                <div class="result-verse-text">${highlightMatch(m.text,cleanedQuery)}</div>
            </div>`;
        });
        el.innerHTML=html;
        attachSearchHandlers();
    }catch(e){el.innerHTML='<div class="search-empty">تعذر إتمام البحث، تحقق من الاتصال.</div>';}
}

            // التعديل بعد ذلك يتم من حقلي "من/إلى" الموجودين أصلًا في الشريط السفلي
            recitationRange={surah,surahName:name,verses,fromAyah:1,toAyah:verses};

            rangeFromInline.value=1;
            rangeToInline.value=verses;
            rangeFromInline.max=verses;
            rangeToInline.max=verses;

        });
    });

function syncInlineRange(){
    if(!recitationRange) return;
    const max=recitationRange.verses||604;
    let from=parseInt(rangeFromInline.value,10)||1;
    let to=parseInt(rangeToInline.value,10)||max;
    from=Math.max(1,Math.min(from,max));
    to=Math.max(1,Math.min(to,max));
    if(from>to){const t=from;from=to;to=t;}
    rangeFromInline.value=from;rangeToInline.value=to;
    recitationRange.fromAyah=from;recitationRange.toAyah=to;
}
rangeFromInline.addEventListener('change',syncInlineRange);
rangeToInline.addEventListener('change',syncInlineRange);

}

function findAyahElement(surah,ayah){
    const parts=ayahIndex.get(Number(surah)+'-'+Number(ayah));
    return (parts&&parts.length)?parts[0]:null;
}

// تعديل الدالة لترجع true إذا تغيرت الصفحة فعلاً
async function ensurePageForAyah(surah,ayah){
    const info=await fetchAyahInfo(surah,ayah);
    const page=info.page||surahForPageStart(surah);
    if(page&&page!==currentPage){
        currentPage=page;
        await loadPage(page);
        return true; 
    }
    return false;
}

async function playCurrentRangeAyah(){
    if(!playbackState.active) return;
    const {surah,currentAyah}=playbackState;
    
    // الانتظار إذا تم تغيير الصفحة لتحميل المصحف أولاً
    const pageChanged = await ensurePageForAyah(surah,currentAyah);
    if(!playbackState.active) return; 

    // إذا انتقلنا لصفحة جديدة، ننتظر لحظة صغيرة جداً للتأكد من حساب المستطيلات بدقة ليتم التظليل
    if(pageChanged) {
        await new Promise(res => setTimeout(res, 300));
    }

    const el=findAyahElement(surah,currentAyah);
    if(el){
        removeAyahHighlight();
        addAyahHighlight(el);
    }

    // إذا كانت التلاوة ستبدأ من أول آية في السورة (وليست الفاتحة أو التوبة)، ننطق البسملة أولًا
    // قبل الآية نفسها. نعتمد على ملف الآية الأولى من الفاتحة لأي قارئ، لأن نصها الكامل هو البسملة ذاتها.
    if(playbackState.pendingBismillah && currentAyah===playbackState.fromAyah){
        playbackState.pendingBismillah=false;
        playbackState.playingBismillah=true;
        rangeAudioPlayer.src=`https://everyayah.com/data/${selectedReciter.folder}/001001.mp3`;
        rangeAudioPlayer.play().catch(()=>{});
        updateMediaSession();
        return;
    }

    playActualRangeAyahAudio(surah,currentAyah);
}

function playActualRangeAyahAudio(surah,currentAyah){
    const fs=String(surah).padStart(3,'0'),fa=String(currentAyah).padStart(3,'0');
    rangeAudioPlayer.src=`https://everyayah.com/data/${selectedReciter.folder}/${fs}${fa}.mp3`;
    rangeAudioPlayer.play().catch(()=>{});
    updateMediaSession();
}

/* واجهة برمجية للمتصفح تُعلم النظام أن هناك جلسة تشغيل صوت جارية،
   فتساعد على استمرار التلاوة عند إطفاء الشاشة (بدل تعليقها في الخلفية) */
function updateMediaSession(){
    if(!('mediaSession' in navigator)) return;
    try{
        navigator.mediaSession.metadata=new MediaMetadata({
            title:`${recitationRange?recitationRange.surahName:''} - آية ${toArabicDigits(playbackState.currentAyah||1)}`,
            artist:selectedReciter.name,
            album:'المصحف التفاعلي'
        });
        navigator.mediaSession.playbackState=playbackState.active?'playing':'paused';
    }catch(e){}
}
if('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play',()=>{if(!playbackState.active) startRecitation();});
    navigator.mediaSession.setActionHandler('pause',()=>{if(playbackState.active) stopRecitation();});
}

function restartRecitationFromBeginning(){
    if(!recitationRange){openRangePicker();return;}
    audioPlayer.pause();
    playbackState.active=true;
    playbackState.interruptedByOtherAudio=false;
    playbackState.surah=recitationRange.surah;
    playbackState.fromAyah=recitationRange.fromAyah;
    playbackState.toAyah=recitationRange.toAyah;
    playbackState.currentAyah=recitationRange.fromAyah;
    playbackState.ayahRepeatsLeft=parseInt(repeatAyahInput.value,10)||1;
    playbackState.rangeRepeatsLeft=parseInt(repeatRangeInput.value,10)||1;
    playbackState.pendingBismillah=surahNeedsBismillah(recitationRange.surah,recitationRange.fromAyah);
    playbackState.playingBismillah=false;
    rangePlayBtn.classList.add('playing');
    rangePlayBtn.innerText='⏸';
    playCurrentRangeAyah();
}

/* التشغيل الذكي: يستأنف من نفس الموضع إن كانت هناك جلسة متوقفة مؤقتًا لنفس النطاق،
   ولا يبدأ من جديد إلا إذا لم توجد جلسة سابقة (أو تغيّر النطاق) */
function startRecitation(){
    if(!recitationRange){openRangePicker();return;}
    audioPlayer.pause(); // منع تداخل الأصوات: أوقف أي تلاوة آية/كلمة فردية شغالة عند استئناف تلاوة النطاق
    const sameSession = playbackState.currentAyah!==null
        && playbackState.surah===recitationRange.surah
        && playbackState.fromAyah===recitationRange.fromAyah
        && playbackState.toAyah===recitationRange.toAyah;

    if(sameSession){
        playbackState.active=true;
        rangePlayBtn.classList.add('playing');
        rangePlayBtn.innerText='⏸';

        // إذا تم إيقاف التلاوة سابقًا بسبب صوت آخر (تلاوة آية/كلمة)، أعد نفس الآية من رأسها
        // بدل استئناف نفس اللحظة الصوتية التي توقفت عندها
        if(playbackState.interruptedByOtherAudio){
            playbackState.interruptedByOtherAudio=false;
            playCurrentRangeAyah();
            return;
        }

        const fs=String(playbackState.surah).padStart(3,'0'),fa=String(playbackState.currentAyah).padStart(3,'0');
        const expectedSrc=`https://everyayah.com/data/${selectedReciter.folder}/${fs}${fa}.mp3`;
        if(rangeAudioPlayer.src&&rangeAudioPlayer.src.indexOf(expectedSrc)!==-1&&!rangeAudioPlayer.ended){
            const el=findAyahElement(playbackState.surah,playbackState.currentAyah);
            if(el){removeAyahHighlight();addAyahHighlight(el);}
            rangeAudioPlayer.play().catch(()=>{});
            updateMediaSession();
        }else{
            playCurrentRangeAyah();
        }
        return;
    }
    restartRecitationFromBeginning();
}

function stopRecitation(){
    playbackState.active=false;
    rangePlayBtn.classList.remove('playing');
    rangePlayBtn.innerText='▶';
    rangeAudioPlayer.pause();
    updateMediaSession();
}

rangePlayBtn.addEventListener('click',()=>{
    if(playbackState.active) stopRecitation();
    else startRecitation();
});

document.getElementById('range-restart-btn').addEventListener('click',()=>{
    restartRecitationFromBeginning();
});

rangeAudioPlayer.addEventListener('ended',()=>{
    if(!playbackState.active) return;
    if(playbackState.playingBismillah){
        // انتهت البسملة، الآن ننطق الآية الأولى الفعلية
        playbackState.playingBismillah=false;
        playActualRangeAyahAudio(playbackState.surah,playbackState.currentAyah);
        return;
    }
    playbackState.ayahRepeatsLeft--;
    if(playbackState.ayahRepeatsLeft>0){playCurrentRangeAyah();return;}
    if(playbackState.currentAyah<playbackState.toAyah){
        playbackState.currentAyah++;
        playbackState.ayahRepeatsLeft=parseInt(repeatAyahInput.value,10)||1;
        playCurrentRangeAyah();
        return;
    }
    playbackState.rangeRepeatsLeft--;
    if(playbackState.rangeRepeatsLeft>0){
        playbackState.currentAyah=playbackState.fromAyah;
        playbackState.ayahRepeatsLeft=parseInt(repeatAyahInput.value,10)||1;
        // عند تكرار النطاق كاملًا من جديد، ننطق البسملة مرة أخرى إن كان النطاق يبدأ من أول السورة
        playbackState.pendingBismillah=surahNeedsBismillah(playbackState.surah,playbackState.fromAyah);
        playCurrentRangeAyah();
        return;
    }
    stopRecitation();
});


document.getElementById('btn-index').addEventListener('click',()=>{
    openDrawer('index-drawer','index-backdrop');
    renderIndexList();
});
document.getElementById('btn-search').addEventListener('click',()=>{
    openSearchOverlay();
    document.getElementById('search-results').innerHTML='';
    searchInputEl.value='';
    setTimeout(()=>searchInputEl.focus(),300);
});
document.getElementById('btn-bookmarks').addEventListener('click',()=>{
    openDrawer('bookmarks-drawer','bookmarks-backdrop');
    renderBookmarksList();
});

window.addEventListener('load',()=>{
    applyTheme(localStorage.getItem('quran-theme')==='dark');
    loadPage(currentPage);
    loadChapters();
});
</script>
